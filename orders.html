<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات المتجر الإلكتروني</title>
<style>
  :root{
    --violet:#6d28d9;
    --violet-dark:#4c1d95;
    --violet-light:#ede9fe;
    --gray:#f4f4f6;
    --text:#1f1b2e;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--gray);margin:0;color:var(--text);}
  header{
    background:linear-gradient(135deg, var(--violet), var(--violet-dark));
    color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  }
  header h1{margin:0;font-size:19px;}
  .container{max-width:900px;margin:0 auto;padding:16px;}
  .cfgRow{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .cfgRow input{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid #ddd;}
  .cfgRow button{background:var(--violet);color:#fff;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;}
  .order{
    background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .order .top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px;}
  .order .id{font-weight:800;color:var(--violet-dark);}
  .order .date{font-size:12px;color:var(--muted);}
  .order .cust{margin-top:6px;font-size:14px;}
  .order .cust b{font-weight:700;}
  .items{margin:10px 0;border-top:1px solid #eee;padding-top:8px;}
  .itemRow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--text);}
  .total{font-weight:800;text-align:left;margin-top:6px;}
  .statusRow{display:flex;align-items:center;gap:8px;margin-top:10px;}
  select{padding:7px 10px;border-radius:8px;border:1px solid #ddd;font-family:inherit;}
  .badge{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
  .badge.pending{background:#fef3c7;color:#92400e;}
  .badge.confirmed{background:#dbeafe;color:#1e40af;}
  .badge.done{background:#dcfce7;color:#166534;}
  .badge.cancelled{background:#fee2e2;color:#991b1b;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;}
</style>
</head>
<body>
<header><h1>📦 طلبات المتجر الإلكتروني</h1></header>
<div class="container">
  <div class="cfgRow">
    <input id="cfgApiBase" placeholder="عنوان الخادم، مثال: http://192.168.1.3:3000">
    <input id="cfgShopId" placeholder="رمز المحل">
    <input id="cfgKey" type="password" autocomplete="off" placeholder="مفتاح الحماية (SYNC_KEY)">
    <button onclick="saveConfig()">تحميل الطلبات</button>
  </div>
  <div id="list"></div>
  <div id="emptyMsg" class="empty" style="display:none;">لا توجد طلبات بعد</div>
</div>

<script>
const CFG_KEY = 'orders_admin_config_v1';
function loadConfig(){
  let cfg = {};
  try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); }catch(e){}
  return Object.assign({ apiBase: location.origin, shopId: 'shop1', key: '' }, cfg);
}
let CONFIG = loadConfig();
document.getElementById('cfgApiBase').value = CONFIG.apiBase;
document.getElementById('cfgShopId').value = CONFIG.shopId;
document.getElementById('cfgKey').value = CONFIG.key || '';

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function authHeaders(extra){
  return Object.assign({}, extra || {}, { 'x-sync-key': CONFIG.key || '' });
}

function saveConfig(){
  CONFIG.apiBase = document.getElementById('cfgApiBase').value.trim() || location.origin;
  CONFIG.shopId = document.getElementById('cfgShopId').value.trim() || 'shop1';
  CONFIG.key = document.getElementById('cfgKey').value.trim();
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(CONFIG)); }catch(e){}
  loadOrders();
}

const STATUS_MAP = {
  'قيد الانتظار': 'pending',
  'مؤكد': 'confirmed',
  'تم التسليم': 'done',
  'ملغى': 'cancelled'
};

async function loadOrders(){
  try{
    const res = await fetch(CONFIG.apiBase.replace(/\/$/,'') + '/api/orders/' + encodeURIComponent(CONFIG.shopId), { headers: authHeaders() });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || 'failed');
    const orders = (data.orders || []).sort((a,b) => b.createdAt - a.createdAt);
    const list = document.getElementById('list');
    const emptyEl = document.getElementById('emptyMsg');
    emptyEl.textContent = 'لا توجد طلبات بعد';
    emptyEl.style.display = orders.length ? 'none' : 'block';
    list.innerHTML = orders.map(o => {
      const cls = STATUS_MAP[o.status] || 'pending';
      const date = new Date(o.createdAt).toLocaleString('ar-DZ');
      return `<div class="order">
        <div class="top">
          <span class="id">#${esc(String(o.id).slice(-6))}</span>
          <span class="badge ${cls}">${esc(o.status)}</span>
        </div>
        <div class="date">${esc(date)}</div>
        <div class="cust"><b>${esc(o.customerName)}</b> — ${esc(o.phone)}${o.address ? ' — ' + esc(o.address) : ''}</div>
        ${o.notes ? `<div class="cust" style="color:var(--muted);">ملاحظة: ${esc(o.notes)}</div>` : ''}
        <div class="items">
          ${(o.items || []).map(it => `<div class="itemRow"><span>${esc(it.name)} × ${esc(it.qty)}</span><span>${esc(it.price * it.qty)}</span></div>`).join('')}
        </div>
        <div class="total">المجموع: ${esc(o.total)}</div>
        <div class="statusRow">
          <label style="font-size:13px;color:var(--muted);">تحديث الحالة:</label>
          <select onchange="updateStatus('${esc(o.id)}', this.value)">
            ${Object.keys(STATUS_MAP).map(s => `<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('list').innerHTML = '';
    const emptyEl = document.getElementById('emptyMsg');
    emptyEl.style.display = 'block';
    emptyEl.textContent = (e && e.message && /مفتاح|SYNC_KEY/.test(e.message))
      ? e.message + ' — أدخل المفتاح الصحيح ثم اضغط «تحميل الطلبات».'
      : 'تعذّر الاتصال بالخادم. تحقق من العنوان ورمز المحل.';
  }
}

async function updateStatus(orderId, status){
  try{
    const res = await fetch(CONFIG.apiBase.replace(/\/$/,'') + '/api/order-status/' + encodeURIComponent(CONFIG.shopId) + '/' + encodeURIComponent(orderId), {
      method: 'PUT',
      headers: authHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ status })
    });
    const data = await res.json();
    if(!res.ok || !data.ok) alert(data.error || 'تعذّر تحديث الحالة');
  }catch(e){
    alert('تعذّر الاتصال بالخادم');
  }
  loadOrders();
}

loadOrders();
setInterval(loadOrders, 15000);
</script>
</body>
</html>
